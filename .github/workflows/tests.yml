name: tests

on:
  pull_request:
  schedule:
    - cron: "0 4 * * *"  # 04:00 UTC nightly

jobs:
  fast:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      # TODO: restore once test/fixtures/fetch.sh + LICENSES.md land.
      # - name: fetch fixtures
      #   run: bash test/fixtures/fetch.sh
      - name: harness (fast tier)
        env:
          PHASE: pre-p1
          TIER: fast
          JULIA_NUM_THREADS: "1"
        run: julia --startup-file=no test/runtests.jl

  full:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      # TODO: restore once test/fixtures/fetch.sh + LICENSES.md land.
      # - name: fetch fixtures
      #   run: bash test/fixtures/fetch.sh
      - name: harness (full tier)
        env:
          PHASE: pre-p1
          TIER: full
          JULIA_NUM_THREADS: "auto"
        run: julia --startup-file=no test/runtests.jl
